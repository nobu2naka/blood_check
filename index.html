<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>血圧トラッカー</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Outfit:wght@400;500;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="assets/icons/icon-512.png">

    <!-- PWA & Mobile Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="apple-mobile-web-app-title" content="血圧記録">
    <meta name="theme-color" content="#4361ee">
    <link rel="apple-touch-icon" href="assets/icons/icon-512.png">

    <script src="assets/js/chart.js"></script>
    <script src="assets/js/xlsx.full.min.js"></script>
</head>

<body>
    <div class="app-container">
        <header class="app-header" style="position: relative;">
            <h1>血圧トラッカー</h1>
            <p>健康管理アプリ version 2</p>
            <a href="manual.html" class="manual-link"
                style="position: absolute; right: 0; top: 20px; color: #4361ee; text-decoration: none; border: 1px solid #4361ee; padding: 5px 12px; border-radius: 20px; font-size: 0.9rem; background: white;">使い方
                📖</a>
        </header>

        <main class="dashboard-grid">
            <!-- Data Entry Section -->
            <section class="card input-section">
                <h2><span class="icon">✏️</span> 記録する</h2>
                <form id="bpForm">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="date">日付</label>
                            <input type="date" id="date" required>
                        </div>
                        <div class="form-group">
                            <label>時間帯</label>
                            <div class="radio-group">
                                <label class="radio-label">
                                    <input type="radio" name="period" value="morning" checked>
                                    <span class="radio-custom">☀️ 朝</span>
                                </label>
                                <label class="radio-label">
                                    <input type="radio" name="period" value="evening">
                                    <span class="radio-custom">🌙 晩</span>
                                </label>
                            </div>
                        </div>
                    </div>

                    <div class="measurement-group">
                        <h3>1回目</h3>
                        <div class="form-row three-cols">
                            <div class="form-group">
                                <label>上 (mmHg)</label>
                                <input type="number" id="sys1" placeholder="120" min="50" max="300" required>
                            </div>
                            <div class="form-group">
                                <label>下 (mmHg)</label>
                                <input type="number" id="dia1" placeholder="80" min="30" max="200" required>
                            </div>
                            <div class="form-group">
                                <label>脈拍 (bpm)</label>
                                <input type="number" id="pul1" placeholder="70" min="30" max="250" required>
                            </div>
                        </div>
                    </div>

                    <div class="measurement-group">
                        <h3>2回目</h3>
                        <div class="form-row three-cols">
                            <div class="form-group">
                                <label>上 (mmHg)</label>
                                <input type="number" id="sys2" placeholder="120" min="50" max="300" required>
                            </div>
                            <div class="form-group">
                                <label>下 (mmHg)</label>
                                <input type="number" id="dia2" placeholder="80" min="30" max="200" required>
                            </div>
                            <div class="form-group">
                                <label>脈拍 (bpm)</label>
                                <input type="number" id="pul2" placeholder="70" min="30" max="250" required>
                            </div>
                        </div>
                    </div>

                    <div class="form-group" style="margin-top: 16px;">
                        <label style="display: flex; align-items: center; gap: 8px; cursor: pointer;">
                            <input type="checkbox" id="medication" style="width: auto; cursor: pointer;">
                            <span>💊 服薬済み</span>
                        </label>
                    </div>

                    <button type="submit" class="btn-primary">保存 (平均を算出)</button>
                    <button type="button" id="clearBtn" class="btn-secondary">リセット</button>
                </form>
            </section>

            <!-- Chart Section -->
            <section class="card chart-section">
                <div class="chart-header"
                    style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                    <h2><span class="icon">📊</span> 推移グラフ (平均値)</h2>
                    <div class="chart-toggles" style="font-size: 0.9rem;">
                        <label style="margin-right: 10px;">
                            <input type="radio" name="chartMode" value="unified" checked> 統合 (時系列)
                        </label>
                        <label>
                            <input type="radio" name="chartMode" value="separate"> 朝晩比較
                        </label>
                    </div>
                </div>

                <div class="chart-wrapper">
                    <h3>血圧 (Blood Pressure)</h3>
                    <!-- Flex Container -->
                    <div class="chart-flex-container">
                        <!-- Fixed Axis -->
                        <div class="chart-axis-box">
                            <canvas id="bpChartAxis"></canvas>
                        </div>
                        <!-- Scrollable Data -->
                        <div class="chart-scroll-box">
                            <div class="chart-scroll-video-inner">
                                <canvas id="bpChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="chart-wrapper pulse-chart">
                    <h3>脈拍 (Pulse)</h3>
                    <div class="chart-flex-container">
                        <div class="chart-axis-box">
                            <canvas id="pulseChartAxis"></canvas>
                        </div>
                        <div class="chart-scroll-box">
                            <div class="chart-scroll-video-inner">
                                <canvas id="pulseChart"></canvas>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Table Section -->
            <section class="card table-section">
                <div class="table-header">
                    <h2><span class="icon">📝</span> 測定結果の一覧</h2>
                    <div class="action-buttons">
                        <select id="rangeFilter" class="btn-text"
                            style="border: 1px solid var(--border-color); border-radius: 8px; margin-right: 8px; padding: 2px 5px;">
                            <option value="all">全期間</option>
                            <option value="1">直近1ヶ月</option>
                            <option value="2">直近2ヶ月</option>
                            <option value="3">直近3ヶ月</option>
                            <option value="6">直近6ヶ月</option>
                        </select>
                        <input type="file" id="importFile" accept=".xlsx, .xls, .json" style="display: none;">
                        <button id="importBtn" class="btn-text">Import (Excel/JSON)</button>
                        <button id="exportBtn" class="btn-text">Export (JSON)</button>
                        <button id="printBtn" class="btn-text">Print (PDF)</button>
                    </div>
                </div>
                <div class="table-legend" style="margin-bottom: 12px; font-size: 0.8rem; color: var(--text-secondary);">
                    <span style="color: var(--accent-red); font-weight: bold;"> ●赤字</span>：家庭血圧の基準値（最高135以上 または 最低85以上）
                </div>
                <div class="table-container">
                    <table id="bpTable">
                        <thead>
                            <tr>
                                <th rowspan="2">日付</th>
                                <th colspan="3" class="th-group th-morning">☀️ 朝 (平均)</th>
                                <th colspan="3" class="th-group th-evening">🌙 晩 (平均)</th>
                                <th rowspan="2">服薬</th>
                                <th rowspan="2" class="col-actions">編集</th>
                            </tr>
                            <tr>
                                <th class="th-sub">最高</th>
                                <th class="th-sub">最低</th>
                                <th class="th-sub">脈拍</th>
                                <th class="th-sub">最高</th>
                                <th class="th-sub">最低</th>
                                <th class="th-sub">脈拍</th>
                            </tr>
                        </thead>
                        <tbody>
                            <!-- Data will be inserted here -->
                        </tbody>
                    </table>
                    <div id="noDataMessage" class="no-data">データがまだありません</div>
                </div>
            </section>
        </main>
    </div>
    <script src="script.js"></script>
</body>

</html>
